name: 💡 功能建议
description: 想让某个板块多一个能力，或改一处用着别扭的地方
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你想解决什么
      description: 说场景比说方案有用 —— 你现在是怎么绕过去的、哪一步别扭，写清楚就好
      placeholder: |
        我同时管着几台机器上的网关，每次改完配置都要手动去另一台再改一遍……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的形态
      description: 心里已经有具体做法的话（按钮放哪、设置项叫什么、默认值是什么）写在这里

  - type: dropdown
    id: module
    attributes:
      label: 大概属于哪个板块
      description: 拿不准就选「不确定」，只是用来分流的
      options:
        - 反代网关
        - 技能仓库
        - 用量统计
        - 记忆中枢
        - 界面与设置
        - 安装 / 部署（Docker、自动更新）
        - 不确定

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有替代办法
      description: 现有功能能不能凑合达到目的？为什么不够？
