name: ➕ 渠道 / 模型支持
description: 希望反代网关接入一个新的客户端，或某个模型现在拿不到
title: "[渠道] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 先说清楚能接什么、不能接什么

        反代网关是把**桌面 / CLI 客户端的登录态**包装成本地 OpenAI 兼容接口（号池里的 trae、workbuddy、
        zcode、qoder、raccoon、catpaw、autoclaw、cline 都是这个路子），所以能接的前提大致是：

        - 这家有一个能装在本机的客户端，且它自己发出去的请求可以被本地程序复刻；
        - **纯开放平台（只认 API Key）的服务不用在这里提** —— 「反代网关 → 自定义提供商」把 Base URL
          和 Key 填上就能直接用；
        - **纯网页版、没有本地客户端的**基本接不了，因为拿不到可复刻的请求形态；
        - 上游改协议随时可能让某一家失效，接进来不等于长期可用。

        下面所有字段都是**选填**，但填得越全，越容易判断值不值得接。

  - type: input
    id: client
    attributes:
      label: 哪一家 / 哪个客户端
      placeholder: 例如：某某 Code 桌面端
    validations:
      required: true

  - type: input
    id: site
    attributes:
      label: 官网 / 下载地址
      placeholder: https://...

  - type: dropdown
    id: region
    attributes:
      label: 地区版本
      options:
        - 只有国内版
        - 只有国际版
        - 国内版和国际版都要
        - 不确定

  - type: dropdown
    id: auth
    attributes:
      label: 它是怎么登录的（可多选）
      multiple: true
      options:
        - 手机号 + 验证码
        - 邮箱 / 网页 OAuth 登录
        - 账号密码
        - 设备码 / 扫码
        - 只认 API Key（开放平台）
        - 不清楚

  - type: textarea
    id: models
    attributes:
      label: 它有哪些模型 / 额度怎么算
      description: 模型 id、上下文长度、是否按次或按额度计费，知道多少写多少

  - type: textarea
    id: notes
    attributes:
      label: 其它信息
      description: 抓包线索、官方文档链接、你手上有没有可用的测试账号，都放这里
