# 反代网关 Docker 形态 CI：共享核心自测（Node 22，与镜像基座同版本）+ 镜像构建与容器冒烟。
# 与 release.yml（exe 发版）解耦：本流水线失败不阻塞发版，但保护 Docker 形态的可用性。
#
# 覆盖边界说明：
# - proxy-smoke（含本机路径与 IDE 切换面）与 config 落盘的三个 selftest 未纳入（Windows 基座覆盖）；
# - 转发链路的容器内 e2e（假上游）为后续增强，当前以「构建 + 加载闭包 + API 契约 + 优雅停机」为门禁。
name: Gateway CI

on:
  push:
    paths:
      - 'gateway/**'
      - 'electron/backend/**'
      - 'tools/proxy-*.cjs'
      - 'tools/gateway-*.cjs'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'electron/backend/**'
      - 'tools/proxy-*.cjs'
      - 'tools/gateway-*.cjs'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: 安装运行时依赖（与镜像同源；lock 与 package.json 漂移时退回 install）
        run: npm ci --omit=dev || npm install --omit=dev --no-audit --no-fund

      - name: 依赖闭包断言（防 Dockerfile COPY 与真实闭包漂移）
        run: node tools/gateway-closure-check.cjs

      - name: 共享核心自测（纯 Node 基座）
        shell: bash
        run: |
          set -euo pipefail
          # 每个脚本独立沙箱：任何一个脚本都不允许读写真实用户数据
          run_sbx() {
            local t="$1"; shift
            echo "=== $t ==="
            AGENTHUB_DATA_DIR="$(mktemp -d)" AGENT_SKILLS_HOME="$(mktemp -d)" node "$t" "$@"
          }
          run_sbx tools/proxy-crypto-envelope-selftest.cjs
          run_sbx tools/proxy-adapter-contract-selftest.cjs
          run_sbx tools/proxy-key-lww-selftest.cjs
          run_sbx tools/proxy-failover-selftest.cjs
          run_sbx tools/proxy-cost-route-selftest.cjs
          run_sbx tools/proxy-empty-pool-route-selftest.cjs

  docker:
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: 构建镜像
        run: docker build -f gateway/Dockerfile -t agenthub-gateway:ci .

      - name: 镜像内依赖闭包加载
        run: |
          docker run --rm --entrypoint node agenthub-gateway:ci -e "
            const p = require('path'), PY = '/app/electron/backend/proxy';
            ['store','rules','adapters','pool','credits','poolsched','server','discovery'].forEach((m) => require(p.join(PY, m + '.cjs')));
            require(p.join(PY, 'index.cjs'));
            console.log('CLOSURE LOAD OK');"

      - name: fail-closed（未设 AGENTHUB_SECRET_KEY 必须拒绝启动）
        run: |
          set -euo pipefail
          if docker run --rm agenthub-gateway:ci > /tmp/failclosed.log 2>&1; then
            echo "预期拒绝启动，但容器以 0 退出"; cat /tmp/failclosed.log; exit 1
          fi
          grep -q "拒绝启动" /tmp/failclosed.log
          echo "fail-closed ✓"

      - name: 容器运行冒烟（API 契约 + 备份 + 优雅停机）
        run: |
          set -euxo pipefail
          docker run -d --name gw-ci \
            -e AGENTHUB_SECRET_KEY=ci-secret-0123456789 \
            -e AGENTHUB_ADMIN_TOKEN=ci-admin-token-0123456789 \
            -p 127.0.0.1:19527:9527 -p 127.0.0.1:19528:9528 \
            agenthub-gateway:ci
          trap 'echo "=== 容器日志（诊断）==="; docker logs gw-ci 2>&1 | tail -60 || true; docker rm -f gw-ci >/dev/null 2>&1 || true' EXIT

          # 探针免凭据（Dockerfile HEALTHCHECK 同款语义：probe 不带 token）
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:19528/api/livez && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:19528/api/livez | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19528/api/readyz)" = "503"

          AUTH='authorization: Bearer ci-admin-token-0123456789'
          # 鉴权：无 token 401；带 token 可签发 sk- Key 并读到状态
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:19528/api/keys -H 'content-type: application/json' -d '{}')" = "401"
          curl -fsS -X POST http://127.0.0.1:19528/api/keys \
            -H "$AUTH" -H 'content-type: application/json' -d '{"name":"ci"}' | grep -q '"secret":"sk-'
          curl -fsS -H "$AUTH" http://127.0.0.1:19528/api/status | grep -q '"ok":true'

          # 反代面模型目录
          curl -fsS http://127.0.0.1:19527/v1/models | grep -q '"object":"list"'

          # 状态字段（与桌面 gatewayStatus 对齐）：外部监控不必再走 RPC
          curl -fsS -H "$AUTH" http://127.0.0.1:19528/api/status | grep -q '"keyCount"'

          # 实时事件流：订阅后触发渠道启停，应收到与桌面同形的事件信封
          curl -sN --max-time 6 -H "$AUTH" http://127.0.0.1:19528/api/events > /tmp/sse.log &
          sleep 1
          curl -fsS -X POST http://127.0.0.1:19528/api/rpc -H "$AUTH" -H 'content-type: application/json' \
            -d '{"cmd":"proxy_channel_toggle","args":{"channel":"modelscope","enabled":false}}' > /dev/null
          sleep 2
          grep -q '"event":"proxy"' /tmp/sse.log

          # 备份端点产物可打开且完整
          curl -fsS -H "$AUTH" -o /tmp/backup.db http://127.0.0.1:19528/api/backup
          node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('/tmp/backup.db');if(d.prepare('PRAGMA integrity_check').get().integrity_check!=='ok')process.exit(1);console.log('backup integrity ok');d.close();"

          # 优雅停机：SIGTERM → drain → exit 0（宽限 25s 覆盖 15s drain 上限）
          docker stop -t 25 gw-ci > /dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' gw-ci)" = "0"
          echo "优雅停机退出码 0 ✓"
